name: Weekly Job Search

on:
  schedule:
    # Segunda 06:17 UTC ≈ 08:17 Stockholm (CEST verão) / 07:17 (CET inverno)
    # NÃO uso "0 7" (hora cheia) porque GitHub Actions free tier atrasa/descarta
    # jobs agendados em horários de pico (hora cheia). Minutos "ímpares" disparam
    # com muito mais confiabilidade.
    - cron: '17 6 * * 1'
  workflow_dispatch:  # botão de "Run workflow" na UI do GitHub

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário para commitar o seen.db atualizado
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # resolve warning Node.js 20 deprecation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Resend (debug)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          echo "Testing Resend API..."
          echo "TO: $EMAIL_TO"
          echo "FROM: $EMAIL_FROM"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"$EMAIL_FROM\",\"to\":[\"$EMAIL_TO\"],\"subject\":\"🔧 Vagas-agent debug test\",\"text\":\"If this arrives, Resend is working. The issue is in the Python code.\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP $HTTP_CODE"
          echo "Response: $BODY"

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python -m src.main

      - name: Commit updated seen.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.db || true
          git diff --staged --quiet || git commit -m "chore: update seen jobs DB [skip ci]"
          git push || true
