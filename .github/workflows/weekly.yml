name: Weekly Job Search

on:
  schedule:
    # Segunda 07:00 UTC ≈ 09:00 Stockholm no verão (CEST) / 08:00 no inverno (CET)
    - cron: '0 7 * * 1'
  workflow_dispatch:  # botão de "Run workflow" na UI do GitHub

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário para commitar o seen.db atualizado
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # resolve warning Node.js 20 deprecation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python -m src.main

      - name: Commit updated seen.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.db || true
          git diff --staged --quiet || git commit -m "chore: update seen jobs DB [skip ci]"
          git push || true
