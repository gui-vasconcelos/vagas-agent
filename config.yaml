candidate_profile: >
  Postdoc na KTH com foco em Embodied Design e Soma Design.
  Pesquisador híbrido: Arquitetura, Interação Humano-Computador (HCI) e Tecnologias Imersivas (XR/VR).
  Especialista em Fenomenologia, Atmosfera e o papel do corpo no espaço digital e físico.
  Busca exclusivamente posições TENURE-TRACK ou TENURED (Assistant Professor com tenure-track,
  Associate Professor, Lektor, Førsteamanuensis, Senior Lecturer no Reino Unido).
  Postdocs comuns NÃO interessam — o candidato já está em postdoc na melhor instituição da área.
  Postdocs com promessa explícita de conversão em tenure-track (ex: Wallenberg Academy Fellow,
  Marie Curie com path declarado, Research Fellow com tenure pipeline) podem ser considerados.

keywords:
  # Core HCI & Design
  - HCI
  - interaction design
  - embodied interaction
  - soma design
  - somaesthetics
  - design research
  # Architecture & Space
  - computational design
