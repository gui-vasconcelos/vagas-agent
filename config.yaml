  - responsive environments
  - spatial computing
  - smart cities phenomenology
  - architecture and computation
  # Technology
  - XR
  - VR
  - AR
  - mixed reality
  - immersive environments
  # Job-level signals (úteis no pré-filtro)
  - assistant professor
  - associate professor
  - tenure-track
  - tenure track
  - lektor
  - lecturer
  - senior lecturer
  - førsteamanuensis
  - professor
  # Postdocs com path claro de tenure (raros, mas captura quando aparecem)
  - tenure-track fellow
  - wallenberg
  - research fellow

